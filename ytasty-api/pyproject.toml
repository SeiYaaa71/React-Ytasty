[project]
name = "ytasty"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Martin" },
    { name = "Abdelmalek" },
    { name = "Matteo" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "fastapi>=0.141.1",
    "email-validator>=2.2.0",
    "psycopg[binary]>=3.3.5",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[project.scripts]
ytasty = "ytasty:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
